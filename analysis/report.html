<script id="bundle" type="application/json">__PAPER_DATA_bundle__</script>
<script>

const B = (() => {
  const saved = JSON.parse(document.getElementById('bundle').textContent);
  const tokens = saved.distribution.n_tokens;
  const documents = saved.bigscan?.n_docs ?? saved.local_metadata?.population_documents;
  const title = saved.neuron.id + ' · ' + tokens + ' saved tokens';
  const lede = Number(tokens).toLocaleString() + ' tokens · ' +
    Number(documents).toLocaleString() + ' documents · saved native gate/value/product.';
  return {
    ...saved,
    neuron: {...saved.neuron, autointerp_label: null, autointerp_description: null},
    claim: {title, lede, one_paragraph: '—', negative_pole: null,
      what_would_change_my_mind: null, confidence: null},
    version: {...saved.version, n: null, ts: null, history: []},
    criticism: [],
    appendix: {...saved.appendix, notes: [], provenance: []},
    headline: saved.headline ? {...saved.headline,
      strip: saved.headline.strip ? {...saved.headline.strip,
        caption: 'Natural-corpus context at the strongest saved document peak.'} : null} : null
  };
})();

const POS = '#d9480f', NEG = '#1c6fb5';
const $ = (tag, attrs, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null) continue; if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v); }
  for (const k of kids.flat(Infinity)) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e; };
const svgEl = (tag, attrs, ...kids) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  for (const k of kids.flat(Infinity)) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e; };
const has = x => x != null && (Array.isArray(x) ? x.length > 0 : typeof x !== 'object' || Object.keys(x).length > 0);
const fmt = (v, d) => { if (v == null || Number.isNaN(+v)) return '–'; v = +v; if (d != null) return v.toFixed(d); if (Number.isInteger(v)) return String(v);
  const a = Math.abs(v); if (a >= 100) return v.toFixed(0); if (a >= 10) return v.toFixed(1); if (a >= 1) return v.toFixed(2); if (a === 0) return '0'; return String(parseFloat(v.toPrecision(2))); };
const pct = v => v == null ? '–' : v >= 0.995 ? '100%' : (100 * v).toFixed(v < 0.1 ? 1 : 0) + '%';
const hexA = (hex, a) => hex + Math.round(Math.max(0, Math.min(1, a)) * 255).toString(16).padStart(2, '0');
const mixHex = (hex, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - t) + 255 * t).toString(16).padStart(2, '0')).join('');
const mag = (v, scale) => scale > 0 ? Math.sqrt(Math.min(1, Math.abs(v) / scale)) : 0;
const poleOf = g => typeof g.pole === 'number' ? (g.pole > 0 ? 'positive' : g.pole < 0 ? 'negative' : 'either') : (g.pole || 'either');
const isOther = g => /^other$/i.test(String(g.id || '')) || /^other$/i.test(g.name || '');
// Pole-and-order palette shared by the spectrum and the clusters: warm ramp for positive-pole items, cool ramp for negative, greys between. "other" gets null (hatched by the caller).
const polePalette = items => { const col = {}; const pos = items.filter(g => poleOf(g) === 'positive'), neg = items.filter(g => poleOf(g) === 'negative'), mid = items.filter(g => poleOf(g) === 'either' && !isOther(g));
  pos.forEach((g, i) => col[g.id] = mixHex(POS, pos.length > 1 ? 0.6 * i / (pos.length - 1) : 0));
  neg.forEach((g, i) => col[g.id] = mixHex(NEG, neg.length > 1 ? 0.6 * (neg.length - 1 - i) / (neg.length - 1) : 0));
  mid.forEach((g, i) => col[g.id] = mixHex('#5c5c62', mid.length > 1 ? 0.5 * i / (mid.length - 1) : 0.25));
  items.filter(isOther).forEach(g => col[g.id] = null); return col; };
const HATCH_CSS = 'repeating-linear-gradient(135deg,#9a9aa0 0 1px,#e6e6e9 1px 4px)';
