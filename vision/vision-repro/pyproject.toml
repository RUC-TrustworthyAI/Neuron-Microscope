[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-neuron-microscope"
version = "0.2.0"
description = "Reproducible InceptionV1 feature visualization, natural-example retrieval and neuron microscope"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=1.26,<3",
  "Pillow>=10,<13", "PyYAML>=6,<7", "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vision-microscope = "vision_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_repro = ["defaults/*.json", "web/microscope/*.html", "web/microscope/*.js", "web/microscope/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires locally provisioned weights and a CUDA device"]
