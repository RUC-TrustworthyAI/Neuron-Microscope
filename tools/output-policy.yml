# Capture complete shell output; native spill policy bounds only the model-visible preview.
- id: persistent-bash
  config:
    timeoutMs: 10800000
    maxOutputChars: 9007199254740991
- id: terminal-bash
  config:
    scrollbackLines: 9007199254740991
    scrollbackMaxBytes: 9007199254740991
    maxReadBytes: 9007199254740991

- insert:
    - id: spill-local
      name: '@deepseek-ai/dsh-spill-local'
      config:
        root: /workspace/tool-results
        cleanupPeriodDays: 0
    - id: spill-policy
      name: '@deepseek-ai/dsh-spill-policy'
      config:
        maxInlineTokens: 10000
