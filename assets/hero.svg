<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Neuron Investigator</title>
  <desc id="desc">A branching N-shaped neuron mark beside the project name, in blue and orange on a light background. Conceptual project artwork, not experimental data.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset=".52" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f6ff"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a3156"/><stop offset="1" stop-color="#294b80"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77a9f2"/><stop offset="1" stop-color="#377be0"/></linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#paper)"/>
  <path d="M1340 -70L1560 -70L1360 130Q1330 160 1292 160H1190Z" fill="#eaf2ff"/>
  <path d="M1430 500L1600 330V500Z" fill="#e5efff"/>
  <path d="M-50 410L90 270Q112 248 136 269Q159 291 135 315L-20 470Z" fill="#e5efff"/>
  <rect x="1370" y="90" width="148" height="10" rx="5" fill="#d8e7fc"/>
  <rect x="1430" y="113" width="88" height="10" rx="5" fill="#e7effa"/>
  <ellipse cx="267" cy="421" rx="181" ry="17" fill="#dae7f9" opacity=".45"/>

  <!-- One branching mark, with an N-shaped central path. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M177 157L125 110H84M177 242H99L68 210M177 325L117 370H78" stroke="#b1c9eb" stroke-width="8"/>
    <path d="M356 164L410 112H452M356 250H428L463 221M356 331L408 379H448" stroke="#b1c9eb" stroke-width="8"/>
    <path d="M177 357V147Q177 125 198 125Q210 125 221 143L314 329Q325 350 339 350Q356 350 356 329V144" stroke="url(#ink)" stroke-width="40"/>
    <path d="M217 156L312 333" stroke="url(#accent)" stroke-width="24"/>
    <path d="M356 145V118" stroke="#294b80" stroke-width="22"/>
    <path d="M177 358V383" stroke="#1a3156" stroke-width="22"/>
  </g>
  <g fill="#f9fbff" stroke="#7aa0d5" stroke-width="5">
    <circle cx="78" cy="110" r="11"/><circle cx="62" cy="206" r="11"/><circle cx="72" cy="370" r="11"/>
    <circle cx="458" cy="106" r="11"/><circle cx="470" cy="217" r="11"/><circle cx="455" cy="385" r="11"/>
  </g>
  <circle cx="268" cy="250" r="39" fill="#fff"/>
  <circle cx="268" cy="250" r="29" fill="#e66f3d"/>
  <circle cx="259" cy="240" r="7" fill="#ffbd91"/>
  <path d="M391 62V83M380 73H402" stroke="#e3976c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="119" cy="416" r="5" fill="#83a9df"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="526" y="246" font-size="82" font-weight="800" letter-spacing="-2.5" fill="#172844">Neuron Investigator</text>
    <text x="530" y="303" font-size="29" fill="#6a7890">Understanding neurons through evidence and experiments.</text>
    <path d="M532 342H582" stroke="#e66f3d" stroke-width="5" stroke-linecap="round"/>
    <path d="M594 342H644" stroke="#4b86d4" stroke-width="5" stroke-linecap="round"/>
