    <text style="fill: #1f2328; font: 700 18px 'Arial Unicode MS'; text-anchor: start" x="30.24" y="31.604062" transform="rotate(-0 30.24 31.604062)">L55_N11703  ·  Colorado</text>
   </g>
   <g id="text_2">
    <text style="fill: #656d76; font: 12px 'Arial Unicode MS'; text-anchor: start" x="30.24" y="57.261375" transform="rotate(-0 30.24 57.261375)">Published report</text>
   </g>
   <g id="text_3">
    <text style="fill: #656d76; font: 12px 'Arial Unicode MS'; text-anchor: start" x="462.24" y="57.302625" transform="rotate(-0 462.24 57.302625)">Reproduced report  ·  Reasoning Mix 100M</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f2328; font: 700 21px 'Arial Unicode MS'" transform="translate(30.24 101.399344)">Colorado neuron: gate opens</text>
    <text style="fill: #1f2328; font: 700 21px 'Arial Unicode MS'" transform="translate(30.24 123.389789)">before a fill-in value, up</text>
    <text style="fill: #1f2328; font: 700 21px 'Arial Unicode MS'" transform="translate(30.24 144.8595)">carries signed place identity</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f2328; font: 700 21px 'Arial Unicode MS'" transform="translate(462.24 101.399344)">Colorado named-entity/local-</text>
    <text style="fill: #1f2328; font: 700 21px 'Arial Unicode MS'" transform="translate(462.24 123.095461)">institution detector with narrow</text>
    <text style="fill: #1f2328; font: 700 21px 'Arial Unicode MS'" transform="translate(462.24 144.565172)">non-Colorado administrative</text>
    <text style="fill: #1f2328; font: 700 21px 'Arial Unicode MS'" transform="translate(462.24 166.034883)">suppression</text>
   </g>
   <g id="text_6">
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(30.24 223.599563)">Colorado cues are strongest just before a place-</text>
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(30.24 241.826906)">specific value. The report separates the fill-in</text>
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(30.24 259.903313)">role of the gate from signed place information</text>
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(30.24 277.874719)">in the up projection.</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(462.24 223.599563)">Colorado places and institutions predict</text>
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(462.24 241.420031)">positive responses across the surrounding</text>
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(462.24 259.647375)">context. The negative account covers specific</text>
    <text style="fill: #1f2328; font: 14px 'Arial Unicode MS'" transform="translate(462.24 277.874719)">non-Colorado agency contact and citation blocks.</text>
   </g>
   <g id="text_8">
    <text style="fill: #656d76; font: 12px 'Arial Unicode MS'; text-anchor: start" x="30.24" y="343.823625" transform="rotate(-0 30.24 343.823625)">Contact variants: Colorado institutions +188 to +352; generic clinic with a 720 area code +165.</text>
   </g>
